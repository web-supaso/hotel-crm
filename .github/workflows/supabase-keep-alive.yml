name: Supabase Keep-Alive (Evitar pausa por inactividad)

on:
  schedule:
    # Se ejecuta cada 3 días a las 06:00 UTC (garantiza que nunca llegue a los 7 días de inactividad)
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Permite dispararlo manualmente desde GitHub Actions cuando quieras

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Validar y hacer Ping a Supabase REST API
        env:
          RAW_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          RAW_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e '
          let url = (process.env.RAW_URL || "").trim().replace(/^["'"'"']|["'"'"']$/g, "").replace(/^NEXT_PUBLIC_SUPABASE_URL=/, "").replace(/^SUPABASE_URL=/, "").trim();
          let key = (process.env.RAW_KEY || "").trim().replace(/^["'"'"']|["'"'"']$/g, "").replace(/^NEXT_PUBLIC_SUPABASE_ANON_KEY=/, "").replace(/^SUPABASE_ANON_KEY=/, "").trim();

          if (!url) {
            console.error("❌ Falta el secret de URL en GitHub (nómbralo NEXT_PUBLIC_SUPABASE_URL o SUPABASE_URL).");
            process.exit(1);
          }
          if (!key) {
            console.error("❌ Falta el secret de API Key en GitHub (nómbralo NEXT_PUBLIC_SUPABASE_ANON_KEY o SUPABASE_ANON_KEY).");
            process.exit(1);
          }

          // Limpiar barra final
          url = url.replace(/\/+$/, "");

          if (!url.startsWith("http://") && !url.startsWith("https://")) {
            console.error("❌ La URL de Supabase no es válida (debe empezar con https://):", url);
            process.exit(1);
          }

          const targetEndpoint = `${url}/rest/v1/organizations?select=id&limit=1`;
          console.log("📡 URL base detectada:", url);
          console.log("📡 Enviando ping de actividad...");

          fetch(targetEndpoint, {
            method: "GET",
            headers: {
              "apikey": key,
              "Authorization": `Bearer ${key}`
            }
          })
          .then(async (res) => {
            console.log("HTTP Status recibido:", res.status);
            const text = await res.text();
            if (res.ok) {
              console.log("✅ Ping exitoso. La base de datos de Supabase se mantendrá activa sin pausarse.");
              process.exit(0);
            } else {
              console.error(`❌ El ping devolvió código ${res.status}: ${res.statusText}`);
              console.error("Detalle de respuesta:", text);
              process.exit(1);
            }
          })
          .catch((err) => {
            console.error("❌ Error en la conexión de red:", err.message);
            process.exit(1);
          });
          '
