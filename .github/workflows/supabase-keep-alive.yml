name: Supabase Keep-Alive (Evitar pausa por inactividad)

on:
  schedule:
    # Se ejecuta cada 3 días a las 06:00 UTC (garantiza que nunca llegue a los 7 días de inactividad)
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Permite dispararlo manualmente desde GitHub Actions cuando quieras

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar y hacer Ping a Supabase REST API
        env:
          RAW_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          RAW_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          node -e '
          let url = (process.env.RAW_URL || "").trim().replace(/^["'"'"']|["'"'"']$/g, "").replace(/^NEXT_PUBLIC_SUPABASE_URL=/, "").trim();
          let key = (process.env.RAW_KEY || "").trim().replace(/^["'"'"']|["'"'"']$/g, "").replace(/^NEXT_PUBLIC_SUPABASE_ANON_KEY=/, "").trim();

          if (!url || !key) {
            console.error("❌ Faltan los secrets NEXT_PUBLIC_SUPABASE_URL o NEXT_PUBLIC_SUPABASE_ANON_KEY en GitHub -> Settings -> Secrets and variables -> Actions.");
            process.exit(1);
          }

          // Eliminar barra final si la tiene
          url = url.replace(/\/+$/, "");

          if (!url.startsWith("http://") && !url.startsWith("https://")) {
            console.error("❌ La URL de Supabase no es válida:", url);
            process.exit(1);
          }

          const targetEndpoint = `${url}/rest/v1/organizations?select=id&limit=1`;
          console.log("📡 Enviando ping a:", targetEndpoint);

          fetch(targetEndpoint, {
            method: "GET",
            headers: {
              "apikey": key,
              "Authorization": `Bearer ${key}`
            }
          })
          .then(async (res) => {
            console.log("HTTP Status recibido:", res.status);
            const text = await res.text();
            console.log("Respuesta:", text);
            if (res.ok) {
              console.log("✅ Ping exitoso. La base de datos de Supabase se mantendrá activa.");
              process.exit(0);
            } else {
              console.error(`❌ El ping devolvió código ${res.status}: ${res.statusText}`);
              process.exit(1);
            }
          })
          .catch((err) => {
            console.error("❌ Error en la conexión:", err.message);
            process.exit(1);
          });
          '
